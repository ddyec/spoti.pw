name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    # Avoid the ARM hosted-runner capacity failure; iOS arm64 remains the target.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check lyrics recording identity
        run: python3 scripts/test-lyrics-identity.py

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - name: Verify the 9.1.78 package components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, plistlib
          outputs = list(Path('out').glob('*.ipa'))
          assert len(outputs) == 1
          with zipfile.ZipFile('ipa/spotify.ipa') as original, zipfile.ZipFile(outputs[0]) as result:
              info_path = next(n for n in original.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/') == 2)
              assert plistlib.loads(original.read(info_path))['CFBundleShortVersionString'] == '9.1.78'
              assert plistlib.loads(result.read(info_path))['CFBundleShortVersionString'] == '9.1.78'
              retained = [n for n in original.namelist() if 'eevee' in n.lower() or 'SwiftProtobuf.framework/' in n]
              assert any(n.endswith('.dylib') for n in retained), 'Supplied EEVEE dylib missing'
              for n in retained:
                  assert n in result.namelist(), 'EEVEE component missing: ' + n
              assert any(n.lower().endswith('/spotifyglass.dylib') for n in result.namelist()), 'New tweak missing'
              # cyan re-signs existing dylibs. The user accepts these differences;
              # do not treat changed signatures as a reason to discard the build.
              print('Found', len(retained), 'supplied EEVEE paths; re-signing differences allowed')
          outputs[0].rename('out/Spotify-9.1.78-Lyrics-Lift-Roll.ipa')
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: spoti-9.1.78-lyrics-lift-roll-ipa
          path: out/*.ipa
          if-no-files-found: error
